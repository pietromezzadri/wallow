# Mirrors the `unfurl` + `unfurl-shard` services in docker-compose.yml.
# depends_on: both wait on nats (healthy) only.
apiVersion: v1
kind: Service
metadata:
  name: unfurl
  namespace: wallow
  labels:
    app: unfurl
spec:
  selector:
    app: unfurl
  ports:
    - name: http
      port: 8090
      targetPort: 8090
---
apiVersion: v1
kind: Service
metadata:
  name: unfurl-shard
  namespace: wallow
  labels:
    app: unfurl-shard
spec:
  selector:
    app: unfurl-shard
  ports:
    - name: http
      port: 8090
      targetPort: 8090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unfurl
  namespace: wallow
  labels:
    app: unfurl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unfurl
  template:
    metadata:
      labels:
        app: unfurl
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -q -O /dev/null http://nats:8222/healthz; do sleep 2; done
      containers:
        - name: unfurl
          image: ghcr.io/fluxerapp/fluxer-unfurl:v1
          ports:
            - name: http
              containerPort: 8090
          envFrom:
            - configMapRef:
                name: wallow-config
            - secretRef:
                name: wallow-secrets
          env:
            - name: FLUXER_POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: wallow-secrets, key: POSTGRES_PASSWORD}}
            - name: FLUXER_SEARCH_API_KEY
              valueFrom: {secretKeyRef: {name: wallow-secrets, key: MEILI_MASTER_KEY}}
            - name: FLUXER_S3_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: wallow-secrets, key: FLUXER_S3_ACCESS_KEY}}
            - name: FLUXER_S3_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: wallow-secrets, key: FLUXER_S3_SECRET_KEY}}
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: wallow-secrets, key: FLUXER_S3_ACCESS_KEY}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: wallow-secrets, key: FLUXER_S3_SECRET_KEY}}
            - name: FLUXER_LIVEKIT_API_KEY
              valueFrom: {secretKeyRef: {name: wallow-secrets, key: LIVEKIT_API_KEY}}
            - name: FLUXER_LIVEKIT_API_SECRET
              valueFrom: {secretKeyRef: {name: wallow-secrets, key: LIVEKIT_API_SECRET}}
            - name: FLUXER_SVC_NAME
              value: "unfurl"
            - name: FLUXER_SVC_MODE
              value: "router"
            - name: FLUXER_MEDIA_PROXY_PUBLIC_ENDPOINT
              value: "http://wallow.local/media"
            - name: FLUXER_STATIC_CDN_ENDPOINT
              value: "http://wallow.local"
          readinessProbe:
            httpGet: {path: /_health, port: 8090}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 15
          livenessProbe:
            httpGet: {path: /_health, port: 8090}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unfurl-shard
  namespace: wallow
  labels:
    app: unfurl-shard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unfurl-shard
  template:
    metadata:
      labels:
        app: unfurl-shard
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -q -O /dev/null http://nats:8222/healthz; do sleep 2; done
      containers:
        - name: unfurl-shard
          image: ghcr.io/fluxerapp/fluxer-unfurl:v1
          ports:
            - name: http
              containerPort: 8090
          envFrom:
            - configMapRef:
                name: wallow-config
            - secretRef:
                name: wallow-secrets
          env:
            - name: FLUXER_POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: wallow-secrets, key: POSTGRES_PASSWORD}}
            - name: FLUXER_SEARCH_API_KEY
              valueFrom: {secretKeyRef: {name: wallow-secrets, key: MEILI_MASTER_KEY}}
            - name: FLUXER_S3_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: wallow-secrets, key: FLUXER_S3_ACCESS_KEY}}
            - name: FLUXER_S3_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: wallow-secrets, key: FLUXER_S3_SECRET_KEY}}
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: wallow-secrets, key: FLUXER_S3_ACCESS_KEY}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: wallow-secrets, key: FLUXER_S3_SECRET_KEY}}
            - name: FLUXER_LIVEKIT_API_KEY
              valueFrom: {secretKeyRef: {name: wallow-secrets, key: LIVEKIT_API_KEY}}
            - name: FLUXER_LIVEKIT_API_SECRET
              valueFrom: {secretKeyRef: {name: wallow-secrets, key: LIVEKIT_API_SECRET}}
            - name: FLUXER_SVC_NAME
              value: "unfurl"
            - name: FLUXER_SVC_MODE
              value: "shard"
            - name: FLUXER_SVC_SHARD_ID
              value: "0"
            - name: FLUXER_MEDIA_PROXY_PUBLIC_ENDPOINT
              value: "http://wallow.local/media"
            - name: FLUXER_STATIC_CDN_ENDPOINT
              value: "http://wallow.local"
          readinessProbe:
            httpGet: {path: /_health, port: 8090}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 15
          livenessProbe:
            httpGet: {path: /_health, port: 8090}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 300m, memory: 256Mi}

# Mirrors the `admin` service in docker-compose.yml. depends_on: api (healthy).
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: wallow
  labels:
    app: admin
spec:
  selector:
    app: admin
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: wallow
  labels:
    app: admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin
  template:
    metadata:
      labels:
        app: admin
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -q -O /dev/null http://api:8080/_health; do sleep 2; done
      containers:
        - name: admin
          image: ghcr.io/fluxerapp/fluxer-admin:v1
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: wallow-config
            - secretRef:
                name: wallow-secrets
          env:
            - name: FLUXER_POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: wallow-secrets, key: POSTGRES_PASSWORD}}
            - name: FLUXER_SEARCH_API_KEY
              valueFrom: {secretKeyRef: {name: wallow-secrets, key: MEILI_MASTER_KEY}}
            - name: FLUXER_S3_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: wallow-secrets, key: FLUXER_S3_ACCESS_KEY}}
            - name: FLUXER_S3_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: wallow-secrets, key: FLUXER_S3_SECRET_KEY}}
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: wallow-secrets, key: FLUXER_S3_ACCESS_KEY}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: wallow-secrets, key: FLUXER_S3_SECRET_KEY}}
            - name: FLUXER_LIVEKIT_API_KEY
              valueFrom: {secretKeyRef: {name: wallow-secrets, key: LIVEKIT_API_KEY}}
            - name: FLUXER_LIVEKIT_API_SECRET
              valueFrom: {secretKeyRef: {name: wallow-secrets, key: LIVEKIT_API_SECRET}}
            - name: FLUXER_ADMIN_HOST
              value: "0.0.0.0"
            - name: FLUXER_ADMIN_PORT
              value: "8080"
            - name: FLUXER_ADMIN_BASE_PATH
              value: "/admin"
            - name: FLUXER_API_ENDPOINT
              value: "http://api:8080"
            - name: FLUXER_ADMIN_ENDPOINT
              value: "http://wallow.local/admin"
            - name: FLUXER_APP_ENDPOINT
              value: "http://wallow.local"
            - name: FLUXER_MEDIA_ENDPOINT
              value: "http://wallow.local/media"
            - name: FLUXER_STATIC_CDN_ENDPOINT
              value: "http://wallow.local"
            - name: FLUXER_ADMIN_OAUTH_REDIRECT_URI
              value: "http://wallow.local/admin/oauth2_callback"
          readinessProbe:
            httpGet:
              path: /_health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /_health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

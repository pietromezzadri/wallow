# Mirrors the `worker` service in docker-compose.yml: same image as api,
# different command/entrypoint, runs background job lanes + the cron
# scheduler. No Service -- compose never publishes ports for it either, it's
# a pure background worker.
#
# depends_on translation: postgres/valkey/nats (healthy), seaweedfs-init
# (completed, approximated via SeaweedFS health -- see 15-seaweedfs-init-job.yaml),
# snowflakes-shard/messages-shard/users-shard (healthy).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: wallow
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -e
              wait_tcp() { until nc -z "$1" "$2"; do echo "waiting for tcp $1:$2"; sleep 2; done; }
              wait_http() { until wget -q -O /dev/null "$1"; do echo "waiting for http $1"; sleep 2; done; }
              wait_tcp postgres 5432
              wait_tcp valkey 6379
              wait_http http://nats:8222/healthz
              wait_http http://seaweedfs:8333/healthz
              wait_http http://snowflakes-shard:8090/_health
              wait_http http://messages-shard:8090/_health
              wait_http http://users-shard:8090/_health
              echo "all dependencies ready"
      containers:
        - name: worker
          image: ghcr.io/fluxerapp/fluxer-api:v1
          workingDir: /usr/src/app/fluxer_api
          command:
            - sh
            - -c
            - "if [ -f dist/WorkerEntrypoint.js ]; then exec node dist/WorkerEntrypoint.js; else exec ./node_modules/.bin/tsx src/WorkerEntrypoint.ts; fi"
          envFrom:
            - configMapRef:
                name: wallow-config
            - secretRef:
                name: wallow-secrets
          env:
            - name: FLUXER_POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: wallow-secrets, key: POSTGRES_PASSWORD}}
            - name: FLUXER_SEARCH_API_KEY
              valueFrom: {secretKeyRef: {name: wallow-secrets, key: MEILI_MASTER_KEY}}
            - name: FLUXER_S3_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: wallow-secrets, key: FLUXER_S3_ACCESS_KEY}}
            - name: FLUXER_S3_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: wallow-secrets, key: FLUXER_S3_SECRET_KEY}}
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: wallow-secrets, key: FLUXER_S3_ACCESS_KEY}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: wallow-secrets, key: FLUXER_S3_SECRET_KEY}}
            - name: FLUXER_LIVEKIT_API_KEY
              valueFrom: {secretKeyRef: {name: wallow-secrets, key: LIVEKIT_API_KEY}}
            - name: FLUXER_LIVEKIT_API_SECRET
              valueFrom: {secretKeyRef: {name: wallow-secrets, key: LIVEKIT_API_SECRET}}
            - name: NODE_OPTIONS
              value: "--enable-source-maps"
            - name: FLUXER_API_WORKER_MODE
              value: "all_lanes"
            - name: FLUXER_API_WORKER_ENABLE_CRON_SCHEDULER
              value: "true"
            - name: FLUXER_POSTGRES_MAX_CONNECTIONS
              value: "25"
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  f=/tmp/fluxer-worker-heartbeat
                  [ -f "$f" ] && [ $(( $(date +%s) - $(stat -c %Y "$f") )) -lt 30 ]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  f=/tmp/fluxer-worker-heartbeat
                  [ -f "$f" ] && [ $(( $(date +%s) - $(stat -c %Y "$f") )) -lt 30 ]
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1500m
              memory: 2Gi

# Mirrors the `seaweedfs` service in docker-compose.yml: single "server -s3"
# process that runs master (9333), volume (8080), filer and S3 (8333)
# together. The Service exposes both 8333 (S3 API, used by every app service)
# and 9333 (master, used only by the 15-seaweedfs-init-job.yaml `weed shell`
# bucket bootstrap).
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: wallow
  labels:
    app: seaweedfs
spec:
  clusterIP: None
  selector:
    app: seaweedfs
  ports:
    - name: s3
      port: 8333
      targetPort: 8333
    - name: master
      port: 9333
      targetPort: 9333
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
  namespace: wallow
  labels:
    app: seaweedfs
spec:
  serviceName: seaweedfs
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.34
          args: ["server", "-s3", "-dir=/data"]
          env:
            - name: GOMEMLIMIT
              value: "1536MiB"
          ports:
            - name: s3
              containerPort: 8333
            - name: master
              containerPort: 9333
            - name: volume
              containerPort: 8080
            - name: filer
              containerPort: 8888
          volumeMounts:
            - name: seaweedfs-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8333
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8333
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: seaweedfs-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi

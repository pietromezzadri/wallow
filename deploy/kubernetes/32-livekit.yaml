# Mirrors the `livekit` service in docker-compose.yml.
#
# =====================================================================
# THE FRAGILE PART. Read this before assuming voice/video "just works".
# =====================================================================
#
# LiveKit's signalling (HTTP/WS on 7880) is ordinary cluster traffic and
# works through the `livekit` ClusterIP Service below like everything else.
# The problem is WebRTC MEDIA (7881/tcp, 7882/udp): browsers connect to those
# ports DIRECTLY, not through the Ingress or any Service proxy, because
# that's how ICE/ WebRTC works -- LiveKit tells the browser "dial me at
# <node_ip>:7881/7882" and the browser does exactly that, bypassing
# kube-proxy and the Ingress controller entirely.
#
# Two structural problems follow from that on minikube:
#
#  1. kube-proxy's normal ClusterIP/NodePort path adds a NAT hop that
#     WebRTC's ICE negotiation cannot see through (LiveKit would advertise an
#     address the browser can dial, but the return path back to the exact
#     pod wouldn't be guaranteed with a plain NodePort's round-robin/SNAT
#     behaviour, and UDP through kube-proxy's iptables/ipvs conntrack has a
#     history of dropping long-idle WebRTC streams).
#  2. k8s NodePort Services can only allocate host ports from 30000-32767 by
#     default, so a NodePort can't even publish literally 7881/7882 -- the
#     ports LiveKit's ICE candidates advertise -- without also reconfiguring
#     LiveKit to advertise the remapped 30000+ ports instead (LIVEKIT_CONFIG
#     rtc.tcp_port/udp_port would need to change to match, and LiveKit and
#     the Service would need to agree on that remap every time either
#     changes).
#
# The workaround here is hostNetwork: true on the LiveKit pod: the container
# binds 7880/7881/7882 directly on the minikube node's own network namespace,
# with no Service/NAT hop in the way for the media ports.
#
# CORRECTED (2026-09-21): an earlier version of this comment claimed the
# node's own address (`minikube ip`, e.g. 192.168.49.2) is NOT reachable
# from WSL at all. That was wrong -- it was tested against port 80, which
# only exists via ingress-nginx's NodePort remap (a different port number
# entirely), not against a real hostNetwork-bound port. A genuinely
# hostNetwork-bound port (confirmed with 7880) IS reachable directly from
# WSL, just not from Windows or the outside world -- WSL sits one layer
# closer to minikube's internal Docker bridge than Windows does.
#
# That distinction is what makes the current setup work. Three pieces,
# all required:
#
#  1. node_ip below is this machine's real public IPv4 (get it with
#     `curl -4 https://ifconfig.me` from WSL). LiveKit advertises this as a
#     genuine host candidate, exactly like a normal non-NAT'd deployment
#     would -- no TURN needed for it to be dialable, PROVIDED the next two
#     pieces get a packet arriving on that IP all the way to LiveKit.
#  2. Your home router must forward TCP 7881 and UDP 7882 to this Windows
#     machine's LAN IP (192.168.15.12 as of 2026-09-21 -- WSL2 mirrored
#     networking makes this the same address for both Windows and WSL) --
#     and Windows Firewall needs inbound-allow rules for those same ports
#     (done: "Wallow LiveKit TCP"/"Wallow LiveKit UDP", New-NetFirewallRule).
#  3. deploy/kubernetes/livekit_relay.py must be running in WSL. It relays
#     those same ports from WSL's own interface through to LiveKit's actual
#     hostNetwork-bound ports on minikube's node (192.168.49.2 by default),
#     which per the correction above, only WSL can reach directly -- this
#     is the one remaining hop kubectl port-forward/netsh can't cover
#     (no UDP support), so a small Python relay stands in instead.
#
#  CAVEAT: node_ip is a residential public IP, which most ISPs rotate
#  periodically (confirmed dynamic here). When it changes, voice breaks
#  silently until node_ip is updated to match and LiveKit restarts -- there
#  is no dynamic-DNS support in LiveKit itself (node_ip must be a literal
#  IP, not a hostname it resolves). node_ip lives in the livekit-node-ip
#  ConfigMap below (not hardcoded in this Deployment's args) specifically so
#  deploy/kubernetes/livekit-ip-watch.sh can patch it and roll the
#  Deployment whenever the detected public IP changes -- see that script
#  for how it's scheduled (cron, since this WSL distro doesn't run it by
#  default).
#
# rtc.turn_servers below (Cloudflare's managed Realtime TURN service,
# turn.cloudflare.com:443, protocol tls) is kept as a fallback candidate for
# clients on networks that block direct UDP/TCP to arbitrary residential
# IPs even with the above working -- it costs nothing to leave configured.
# It is NOT sufficient on its own: LiveKit only uses turn_servers to offer
# clients an extra option, it does not make LiveKit's own side relay
# through TURN, so a server with zero real reachability (no forwarded
# router port) still can't be reached even with valid TURN credentials.
# CF_TURN_USERNAME/CF_TURN_CREDENTIAL come from wallow-secrets
# (CLOUDFLARE_TURN_USERNAME/_CREDENTIAL), which are SHORT-LIVED (24h,
# generated via Cloudflare's credentials/generate-ice-servers API using
# CLOUDFLARE_TURN_KEY_ID/_API_TOKEN, also in that same secret) -- if this
# fallback stops working, this credential has likely expired and needs
# regenerating (see deploy/kubernetes/turn-refresh.sh once that exists;
# until then, regenerate by hand and `kubectl patch secret wallow-secrets
# -n wallow --type=merge --patch-file=<a small JSON file, see git history
# of this file for the exact shape>` -- never `kubectl create secret ... |
# kubectl apply -f -` for a partial update, it replaces the whole object
# and drops every other key; and never inline the base64 values into a
# quoted -p argument through a nested shell, they get silently mangled).
#
# Consequences of hostNetwork: true worth knowing:
#  - Only one LiveKit pod can ever run per node (it owns the host's 7880/
#    7881/7882 outright) -- a non-issue here since this is replicas: 1 on a
#    single-node minikube cluster, but it means this Deployment cannot be
#    scaled the normal way.
#  - dnsPolicy must be ClusterFirstWithHostNet, not the pod-network default,
#    or the container can't resolve in-cluster names like "api" for its
#    webhook callback.
#  - UDP through minikube's own networking layer (the docker driver runs
#    minikube itself as a container; WSL2 adds another virtualization layer
#    below that) is the single least-tested path in this whole deployment.
#    Even with hostNetwork removing kube-proxy from the equation, UDP still
#    has to cross minikube's driver network and WSL2's NAT to reach a real
#    browser. If voice/video connects but audio/video never actually flows,
#    this is where to look first -- try a TURN-over-TCP fallback (LiveKit
#    supports this) before assuming the whole approach is broken.
#
# A NodePort Service is sketched out, commented, at the bottom of this file
# as the alternative if hostNetwork turns out not to work in your setup --
# it requires remapping LIVEKIT_CONFIG's rtc.tcp_port/udp_port to whatever
# 30000-32767 ports you allocate, which is why it isn't the default here.
# Holds just the one value that changes on its own (the home connection's
# public IP) so deploy/kubernetes/livekit-ip-watch.sh can patch it without
# touching the Deployment YAML -- `kubectl patch configmap` is a clean,
# scriptable operation; rewriting node_ip inside the embedded shell heredoc
# below on every IP change would mean sed-editing this file from a cron job,
# which is exactly the kind of fragile text-mangling that's bitten this
# deployment before.
apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-node-ip
  namespace: wallow
data:
  LIVEKIT_NODE_IP: "177.96.125.211"
---
apiVersion: v1
kind: Service
metadata:
  name: livekit
  namespace: wallow
  labels:
    app: livekit
spec:
  selector:
    app: livekit
  ports:
    - name: http
      port: 7880
      targetPort: 7880
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  namespace: wallow
  labels:
    app: livekit
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: livekit
  template:
    metadata:
      labels:
        app: livekit
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # Kubernetes auto-injects a `<SVCNAME>_PORT=tcp://<clusterIP>:<port>`
      # env var into every pod for every Service that exists in the namespace
      # at pod start. Since the Service here is named "livekit" and
      # livekit-server itself binds config flags to LIVEKIT_-prefixed env
      # vars (LIVEKIT_PORT -> --port), the injected value collides with and
      # overrides livekit-server's own port config, and it crashes trying to
      # parse "tcp://10.x.x.x:7880" as a plain port number. Disabling the
      # injection avoids the collision.
      enableServiceLinks: false
      containers:
        - name: livekit
          image: livekit/livekit-server:v1.12.0
          env:
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef: {name: wallow-secrets, key: LIVEKIT_API_KEY}
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef: {name: wallow-secrets, key: LIVEKIT_API_SECRET}
            - name: LIVEKIT_KEYS
              valueFrom:
                secretKeyRef: {name: wallow-secrets, key: LIVEKIT_KEYS}
            - name: CF_TURN_USERNAME
              valueFrom:
                secretKeyRef: {name: wallow-secrets, key: CLOUDFLARE_TURN_USERNAME}
            - name: CF_TURN_CREDENTIAL
              valueFrom:
                secretKeyRef: {name: wallow-secrets, key: CLOUDFLARE_TURN_CREDENTIAL}
            - name: LIVEKIT_NODE_IP
              valueFrom:
                configMapKeyRef: {name: livekit-node-ip, key: LIVEKIT_NODE_IP}
          command: ["sh", "-c"]
          args:
            - |
              set -e
              LIVEKIT_CONFIG=$(cat <<EOF
              port: 7880
              log_level: info
              rtc:
                tcp_port: 7881
                udp_port: 7882
                use_external_ip: false
                node_ip: "$LIVEKIT_NODE_IP"
                stun_servers:
                  - stun.l.google.com:19302
                  - stun1.l.google.com:19302
                turn_servers:
                  - host: turn.cloudflare.com
                    port: 443
                    protocol: tls
                    username: "$CF_TURN_USERNAME"
                    credential: "$CF_TURN_CREDENTIAL"
              webhook:
                api_key: $LIVEKIT_API_KEY
                urls:
                  - http://api:8080/webhooks/livekit
              EOF
              )
              export LIVEKIT_CONFIG
              echo "starting livekit-server with node_ip=$LIVEKIT_NODE_IP (from the livekit-node-ip ConfigMap; deploy/kubernetes/livekit-ip-watch.sh keeps it in sync with this connection's actual public IP) -- requires the router port-forward (TCP 7881, UDP 7882 -> 192.168.15.12) and deploy/kubernetes/livekit_relay.py (WSL -> minikube bridge) both running"
              exec /livekit-server
          ports:
            - name: http
              containerPort: 7880
              protocol: TCP
            - name: rtc-tcp
              containerPort: 7881
              protocol: TCP
            - name: rtc-udp
              containerPort: 7882
              protocol: UDP
          readinessProbe:
            httpGet:
              path: /
              port: 7880
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /
              port: 7880
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
---
# ALTERNATIVE (commented out): a NodePort Service instead of hostNetwork.
# Only use this if hostNetwork proves unworkable in your setup. It needs
# LIVEKIT_CONFIG's rtc.tcp_port/udp_port changed to match the allocated
# 30000-32767 nodePorts (they cannot be 7881/7882 -- see the long comment
# above), and FLUXER_LIVEKIT_URL/STUN advertisement would need to reflect
# the remapped ports too.
#

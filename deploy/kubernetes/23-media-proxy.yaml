# Mirrors the `media-proxy` service in docker-compose.yml. depends_on:
# seaweedfs-init (completed, approximated via SeaweedFS health -- see
# 15-seaweedfs-init-job.yaml), nats (healthy).
#
# Compose defines no healthcheck for this service, but fluxer_media_proxy
# does serve /_health (src/healthcheck.rs), so readiness/liveness probes are
# added here anyway as a reasonable addition beyond what compose specifies.
apiVersion: v1
kind: Service
metadata:
  name: media-proxy
  namespace: wallow
  labels:
    app: media-proxy
spec:
  selector:
    app: media-proxy
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-proxy
  namespace: wallow
  labels:
    app: media-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: media-proxy
  template:
    metadata:
      labels:
        app: media-proxy
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -e
              wait_http() { until wget -q -O /dev/null "$1"; do echo "waiting for http $1"; sleep 2; done; }
              wait_http http://nats:8222/healthz
              wait_http http://seaweedfs:8333/healthz
              echo "all dependencies ready"
      containers:
        - name: media-proxy
          image: ghcr.io/fluxerapp/fluxer-media-proxy:v1
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: wallow-config
            - secretRef:
                name: wallow-secrets
          env:
            - name: FLUXER_POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: wallow-secrets, key: POSTGRES_PASSWORD}}
            - name: FLUXER_SEARCH_API_KEY
              valueFrom: {secretKeyRef: {name: wallow-secrets, key: MEILI_MASTER_KEY}}
            - name: FLUXER_S3_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: wallow-secrets, key: FLUXER_S3_ACCESS_KEY}}
            - name: FLUXER_S3_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: wallow-secrets, key: FLUXER_S3_SECRET_KEY}}
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: wallow-secrets, key: FLUXER_S3_ACCESS_KEY}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: wallow-secrets, key: FLUXER_S3_SECRET_KEY}}
            - name: FLUXER_LIVEKIT_API_KEY
              valueFrom: {secretKeyRef: {name: wallow-secrets, key: LIVEKIT_API_KEY}}
            - name: FLUXER_LIVEKIT_API_SECRET
              valueFrom: {secretKeyRef: {name: wallow-secrets, key: LIVEKIT_API_SECRET}}
            - name: FLUXER_MEDIA_PROXY_HOST
              value: "0.0.0.0"
            - name: FLUXER_MEDIA_PROXY_PORT
              value: "8080"
            - name: FLUXER_MEDIA_PROXY_MODE
              value: "upload"
            - name: FLUXER_MEDIA_PROXY_STORAGE_BACKEND
              value: "s3"
            - name: FLUXER_MEDIA_PROXY_PUBLIC_ENDPOINT
              value: "https://wallow.app.br/media"
            - name: FLUXER_S3_READ_SIGNED
              value: "true"
          readinessProbe:
            httpGet:
              path: /_health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /_health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

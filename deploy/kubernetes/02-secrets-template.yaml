# TEMPLATE / REFERENCE ONLY -- do not `kubectl apply -f` this file as-is.
#
# It documents every key the wallow-secrets Secret must carry (mirrored from
# the required, no-default ${VAR:?...} entries in
# deploy/self-hosting/docker-compose.yml and .env.example) with the literal
# placeholder CHANGEME. Generate real values and apply them with
# ./02-generate-secrets.sh instead, which never writes a real secret value to
# disk.
#
# Container-side env var name mapping: most of these keys share their name
# with the container env var the app reads and are pulled in via a plain
# `envFrom: secretRef` in each Deployment. A few compose host-side names
# differ from the container-side name the app actually reads
# (POSTGRES_PASSWORD -> FLUXER_POSTGRES_PASSWORD, MEILI_MASTER_KEY ->
# FLUXER_SEARCH_API_KEY, FLUXER_S3_ACCESS_KEY -> FLUXER_S3_ACCESS_KEY_ID /
# AWS_ACCESS_KEY_ID, FLUXER_S3_SECRET_KEY -> FLUXER_S3_SECRET_ACCESS_KEY /
# AWS_SECRET_ACCESS_KEY, LIVEKIT_API_KEY -> FLUXER_LIVEKIT_API_KEY,
# LIVEKIT_API_SECRET -> FLUXER_LIVEKIT_API_SECRET); those Deployments add an
# explicit `env:` entry with a `secretKeyRef` to do the rename, same as
# compose's `${POSTGRES_PASSWORD:?...}` substitution into a differently named
# variable.
apiVersion: v1
kind: Secret
metadata:
  name: wallow-secrets
  namespace: wallow
type: Opaque
stringData:
  POSTGRES_PASSWORD: CHANGEME
  MEILI_MASTER_KEY: CHANGEME
  FLUXER_S3_ACCESS_KEY: CHANGEME
  FLUXER_S3_SECRET_KEY: CHANGEME
  FLUXER_SUDO_MODE_SECRET: CHANGEME
  FLUXER_CONNECTION_INITIATION_SECRET: CHANGEME
  FLUXER_GATEWAY_RPC_AUTH_TOKEN: CHANGEME
  FLUXER_MEDIA_PROXY_SECRET_KEY: CHANGEME
  FLUXER_MEDIA_PROXY_UPLOAD_RELAY_SECRET_BASE64: CHANGEME
  FLUXER_ADMIN_SECRET_KEY_BASE: CHANGEME
  FLUXER_ADMIN_OAUTH_CLIENT_SECRET: CHANGEME
  FLUXER_ERLANG_COOKIE: CHANGEME
  LIVEKIT_API_KEY: CHANGEME
  LIVEKIT_API_SECRET: CHANGEME
  FLUXER_VAPID_PUBLIC_KEY: CHANGEME
  FLUXER_VAPID_PRIVATE_KEY: CHANGEME
  # Derived, not hand-edited: LiveKit's own LIVEKIT_KEYS env var wants
  # "<api-key>: <api-secret>" as one string (see the LIVEKIT_KEYS line in the
  # compose livekit service). 02-generate-secrets.sh computes this from the
  # two keys above automatically once they're generated.
  LIVEKIT_KEYS: "CHANGEME: CHANGEME"

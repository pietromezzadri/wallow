# Mirrors the `api` service in docker-compose.yml.
#
# depends_on translation: compose waits on postgres/valkey/nats/meilisearch
# (healthy), seaweedfs-init (completed), and gifs/gifs-shard/snowflakes/
# snowflakes-shard/messages/messages-shard/users/users-shard (healthy). The
# initContainer below polls the equivalent readiness signal for each -- see
# the note in 15-seaweedfs-init-job.yaml about why the SeaweedFS leg checks
# its own health endpoint rather than true Job completion.
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: wallow
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: wallow
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -e
              wait_tcp() { until nc -z "$1" "$2"; do echo "waiting for tcp $1:$2"; sleep 2; done; }
              wait_http() { until wget -q -O /dev/null "$1"; do echo "waiting for http $1"; sleep 2; done; }
              wait_tcp postgres 5432
              wait_tcp valkey 6379
              wait_http http://nats:8222/healthz
              wait_http http://meilisearch:7700/health
              wait_http http://seaweedfs:8333/healthz
              wait_http http://gifs:8090/_health
              wait_http http://gifs-shard:8090/_health
              wait_http http://snowflakes:8090/_health
              wait_http http://snowflakes-shard:8090/_health
              wait_http http://messages:8090/_health
              wait_http http://messages-shard:8090/_health
              wait_http http://users:8090/_health
              wait_http http://users-shard:8090/_health
              echo "all dependencies ready"
      containers:
        - name: api
          image: ghcr.io/fluxerapp/fluxer-api:v1
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: wallow-config
            - secretRef:
                name: wallow-secrets
          env:
            - name: FLUXER_POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: wallow-secrets, key: POSTGRES_PASSWORD}}
            - name: FLUXER_SEARCH_API_KEY
              valueFrom: {secretKeyRef: {name: wallow-secrets, key: MEILI_MASTER_KEY}}
            - name: FLUXER_S3_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: wallow-secrets, key: FLUXER_S3_ACCESS_KEY}}
            - name: FLUXER_S3_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: wallow-secrets, key: FLUXER_S3_SECRET_KEY}}
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: wallow-secrets, key: FLUXER_S3_ACCESS_KEY}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: wallow-secrets, key: FLUXER_S3_SECRET_KEY}}
            - name: FLUXER_LIVEKIT_API_KEY
              valueFrom: {secretKeyRef: {name: wallow-secrets, key: LIVEKIT_API_KEY}}
            - name: FLUXER_LIVEKIT_API_SECRET
              valueFrom: {secretKeyRef: {name: wallow-secrets, key: LIVEKIT_API_SECRET}}
            - name: FLUXER_API_PORT
              value: "8080"
            - name: NODE_OPTIONS
              value: "--enable-source-maps"
            - name: FLUXER_API_PRESIGNED_ATTACHMENT_UPLOADS_ENABLED
              value: "true"
            - name: FLUXER_POSTGRES_MAX_CONNECTIONS
              value: "25"
          readinessProbe:
            httpGet:
              path: /_health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /_health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1500m
              memory: 2Gi
